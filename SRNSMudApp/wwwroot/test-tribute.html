<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="https://unpkg.com/tributejs@5.1.3/dist/tribute.css">
    <script src="https://unpkg.com/tributejs@5.1.3/dist/tribute.min.js"></script>
    <style>
        .tribute-container {
            z-index: 9999;
        }
    </style>
</head>
<body>
    <textarea id="my-textarea" rows="5" cols="40"></textarea>
    <script>
        var tribute = new Tribute({
            trigger: '#',
            values: [
                { key: 'C#', value: '/TagDetail/1' },
                { key: 'Blazor', value: '/TagDetail/2' }
            ],
            selectTemplate: function (item) {
                return ' ' + item.original.value + ' ';
            }
        });
        tribute.attach(document.getElementById('my-textarea'));
    </script>
</body>
</html>
